name: Sync image to ACR
description: Copy one tagged container image to the organization ACR with Skopeo

inputs:
  source:
    description: Source image without a tag, e.g. ghcr.io/qiyin-tech/orchestra-backend or docker.io/library/nginx
    required: true
  tag:
    description: Source tag to copy, e.g. v1.2.3; the same tag is used in ACR
    required: true
  arch:
    description: Architecture to copy from a multi-platform image, e.g. amd64 or arm64
    required: false
    default: amd64
  target_namespace:
    description: Target ACR namespace, e.g. qiyin or public
    required: true
  acr_endpoint:
    description: ACR registry hostname without a repository path, normally passed from vars.ACR_ENDPOINT
    required: true
  source_username:
    description: Optional source registry username; leave empty for public images
    required: false
  source_password:
    description: Optional source registry password or token; leave empty for public images
    required: false
  acr_username:
    description: ACR username, normally passed from vars.ACR_USERNAME
    required: true
  acr_password:
    description: ACR password, normally passed from secrets.ACR_PASSWORD
    required: true

outputs:
  digest:
    description: Digest of the copied single-platform manifest
    value: ${{ steps.sync.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Sync image
      id: sync
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        TAG: ${{ inputs.tag }}
        ARCH: ${{ inputs.arch }}
        TARGET_NAMESPACE: ${{ inputs.target_namespace }}
        SOURCE_USERNAME: ${{ inputs.source_username }}
        SOURCE_PASSWORD: ${{ inputs.source_password }}
        ACR_ENDPOINT: ${{ inputs.acr_endpoint }}
        ACR_USERNAME: ${{ inputs.acr_username }}
        ACR_PASSWORD: ${{ inputs.acr_password }}
        GHCR_USERNAME: ${{ github.actor }}
        GHCR_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/scripts/sync-image
