name: sync-manifest
run-name: sync-manifest (${{ inputs.name || 'changed manifests' }})

on:
  push:
    branches:
      - main
    paths:
      - sync.yml
      - manifest/**
  workflow_dispatch:
    inputs:
      name:
        description: Alias from sync.yml, e.g. dockerhub or ghcr
        required: true
        default: dockerhub
        type: string

permissions:
  contents: read

concurrency:
  group: sync-manifest
  cancel-in-progress: false

jobs:
  prepare:
    name: Select changed manifests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      should_run: ${{ steps.plan.outputs.should_run }}

    steps:
      - name: Check out acr-sync
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build sync matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NAME: ${{ inputs.name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: scripts/prepare-sync-matrix

  sync:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out acr-sync
        uses: actions/checkout@v7

      - name: Sync manifest
        env:
          ARCH: ${{ matrix.arch }}
          TARGET_NAMESPACE: ${{ matrix.target_namespace }}
          MANIFEST_PATH: ${{ matrix.manifest_path }}
          ACR_ENDPOINT: ${{ vars.ACR_ENDPOINT }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: scripts/sync-manifest
