name: Sync one image to ACR
run-name: Sync ${{ inputs.source }}:${{ inputs.tag }} (${{ inputs.kind }}) to ${{ inputs.target_namespace }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Content kind, image or artifact
        required: true
        default: image
        type: choice
        options:
          - image
          - artifact
      source:
        description: Source repository without a tag, e.g. ghcr.io/qiyin-tech/orchestra-backend or ghcr.io/qiyin-tech/1.0-renderer
        required: true
        type: string
      tag:
        description: Source tag to copy, e.g. v1.2.3
        required: true
        type: string
      arch:
        description: Architecture to copy, e.g. amd64 or arm64
        required: true
        default: amd64
        type: string
      target_namespace:
        description: Target ACR namespace, e.g. qiyin
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  sync:
    name: Sync content
    runs-on: ubuntu-latest

    steps:
      - name: Check out acr-sync
        uses: actions/checkout@v7

      - name: Sync image
        uses: ./
        with:
          kind: ${{ inputs.kind }}
          source: ${{ inputs.source }}
          tag: ${{ inputs.tag }}
          arch: ${{ inputs.arch }}
          target_namespace: ${{ inputs.target_namespace }}
          source_username: ${{ (startsWith(inputs.source, 'ghcr.io/') || startsWith(inputs.source, 'docker://ghcr.io/')) && vars.GHCR_USERNAME || '' }}
          source_password: ${{ (startsWith(inputs.source, 'ghcr.io/') || startsWith(inputs.source, 'docker://ghcr.io/')) && secrets.GHCR_TOKEN || '' }}
          acr_endpoint: ${{ vars.ACR_ENDPOINT }}
          acr_username: ${{ vars.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}
